const FIXED_ANCHORS = [10, 54, 55];
const TWIN_SWAPS = { 2: 14, 14: 2, 9: 33, 33: 9 };

// Helper function for Joker (J(x)) - controlled chaos at Golden Ratio Squared [2, 4, 7, 8, 30-34]
function calculateJokerFunction(x) {
    return Math.round(PHI_SQUARED * Math.sin(x * Math.PI / 13) * Math.cos(x / 91));
}

// Helper function for Vision (V(x)) - personalization [7, 8, 56]
function calculateVisionFunction(x, birthCard, sai) {
    return Math.round(Math.abs(Math.sin(birthCard * Math.PI / 52) * Math.cos(x * sai / 91)) * 10);
}

